<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="echoGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090a16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="echoGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090a16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="echoGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#090a16" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="#090d16"/>
  <!-- Top App Bar -->
  <rect x="0" y="0" width="600" height="38" fill="#111827"/>
  <circle cx="20" cy="19" r="5" fill="#ef4444"/>
  <circle cx="36" cy="19" r="5" fill="#eab308"/>
  <circle cx="52" cy="19" r="5" fill="#22c55e"/>
  <text x="300" y="24" fill="#94a3b8" font-family="'Space Grotesk', monospace" font-size="12" text-anchor="middle">echoverse.ai/multiverse-terminal</text>
  
  <!-- Subtle Grid -->
  <line x1="0" y1="120" x2="600" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="0" y1="240" x2="600" y2="240" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="200" y1="38" x2="200" y2="360" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="38" x2="400" y2="360" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  
  <!-- Brand Header -->
  <text x="300" y="90" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="28" text-anchor="middle" letter-spacing="1">EchoVerse AI</text>
  <text x="300" y="112" fill="#818cf8" font-family="'Space Mono', monospace" font-size="11" text-anchor="middle">TEMPORAL &amp; PARALLEL REALITY SIMULATION ENGINE</text>

  <!-- 3 Nodes: Past, Parallel, Future -->
  <!-- Past -->
  <circle cx="120" cy="210" r="60" fill="url(#echoGlow1)"/>
  <circle cx="120" cy="210" r="38" fill="#18182e" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="120" cy="210" r="16" fill="#8b5cf6" opacity="0.8"/>
  <circle cx="120" cy="210" r="48" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="85" y="270" width="70" height="20" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
  <text x="120" y="284" fill="#c7d2fe" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Past</text>
  
  <!-- Parallel Reality -->
  <circle cx="300" cy="210" r="70" fill="url(#echoGlow2)"/>
  <circle cx="300" cy="210" r="45" fill="#0e2338" stroke="#06b6d4" stroke-width="2.5"/>
  <circle cx="300" cy="210" r="22" fill="#06b6d4" opacity="0.9"/>
  <circle cx="300" cy="210" r="56" fill="none" stroke="#67e8f9" stroke-width="1" stroke-dasharray="5 3"/>
  <rect x="245" y="270" width="110" height="20" rx="4" fill="#083344" stroke="#06b6d4" stroke-width="1"/>
  <text x="300" y="284" fill="#a5f3fc" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Parallel Reality</text>
  
  <!-- Future -->
  <circle cx="480" cy="210" r="60" fill="url(#echoGlow3)"/>
  <circle cx="480" cy="210" r="38" fill="#2b1124" stroke="#ec4899" stroke-width="2"/>
  <circle cx="480" cy="210" r="16" fill="#ec4899" opacity="0.8"/>
  <circle cx="480" cy="210" r="48" fill="none" stroke="#f472b6" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="445" y="270" width="70" height="20" rx="4" fill="#4a044e" stroke="#ec4899" stroke-width="1"/>
  <text x="480" y="284" fill="#fbcfe8" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11" text-anchor="middle">Future</text>

  <!-- Connection Links -->
  <line x1="168" y1="210" x2="245" y2="210" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="355" y1="210" x2="432" y2="210" stroke="#f472b6" stroke-width="2" stroke-dasharray="4 4"/>
  
  <!-- Status footer -->
  <rect x="20" y="325" width="560" height="22" rx="4" fill="#111827"/>
  <circle cx="35" cy="336" r="3.5" fill="#22c55e"/>
  <text x="46" y="340" fill="#94a3b8" font-family="'Space Mono', monospace" font-size="10">Active Neural Stream • Latency 14ms • Gemini 2.0 Flash Agent Active</text>
</svg>
