<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <!-- Motor Health Monitor Dashboard Mockup matching reference showcase -->
  <rect width="600" height="360" fill="#0b0f19"/>
  <!-- Top Bar -->
  <rect x="0" y="0" width="600" height="36" fill="#111827"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444"/>
  <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="18" r="5" fill="#10b981"/>
  
  <rect x="76" y="10" width="16" height="16" rx="3" fill="#f59e0b"/>
  <text x="84" y="22" fill="#000" font-family="'Space Grotesk', sans-serif" font-weight="900" font-size="10" text-anchor="middle">⚙</text>
  <text x="100" y="23" fill="#f3f4f6" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12">Motor Health Monitor</text>
  <text x="500" y="23" fill="#10b981" font-family="'Space Mono', monospace" font-size="10">● ARDUINO ONLINE</text>

  <!-- Left: 3D Motor Graphic Representation -->
  <rect x="24" y="54" width="260" height="280" rx="8" fill="#151d2f" stroke="#1f2937" stroke-width="1.5"/>
  <text x="40" y="80" fill="#9ca3af" font-family="'Space Mono', monospace" font-size="10">MOTOR UNIT #04 (3-PHASE AC)</text>
  
  <!-- Stylized Industrial Motor Drawing -->
  <g transform="translate(45, 115)">
    <!-- Base Plate -->
    <path d="M 10 140 L 200 140 L 190 155 L 0 155 Z" fill="#374151" stroke="#4b5563" stroke-width="2"/>
    <!-- Motor Body Cylinder -->
    <rect x="35" y="45" width="130" height="85" rx="10" fill="#1f2937" stroke="#0284c7" stroke-width="2.5"/>
    <!-- Ribs / Cooling Fins -->
    <line x1="50" y1="45" x2="50" y2="130" stroke="#0369a1" stroke-width="2"/>
    <line x1="65" y1="45" x2="65" y2="130" stroke="#0369a1" stroke-width="2"/>
    <line x1="80" y1="45" x2="80" y2="130" stroke="#0369a1" stroke-width="2"/>
    <line x1="95" y1="45" x2="95" y2="130" stroke="#0369a1" stroke-width="2"/>
    <line x1="110" y1="45" x2="110" y2="130" stroke="#0369a1" stroke-width="2"/>
    <line x1="125" y1="45" x2="125" y2="130" stroke="#0369a1" stroke-width="2"/>
    <line x1="140" y1="45" x2="140" y2="130" stroke="#0369a1" stroke-width="2"/>
    <!-- Shaft -->
    <rect x="165" y="75" width="45" height="25" rx="3" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
    <ellipse cx="210" cy="87.5" rx="5" ry="12.5" fill="#64748b"/>
    <!-- Rear fan cover -->
    <rect x="18" y="55" width="17" height="65" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
    <!-- Terminal Box -->
    <rect x="75" y="25" width="50" height="20" rx="3" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
    <!-- Sensor node pulse -->
    <circle cx="100" cy="85" r="7" fill="#ef4444" opacity="0.9"/>
    <circle cx="100" cy="85" r="14" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
  <text x="40" y="315" fill="#10b981" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="11">Status: Normal Operation (No Anomaly)</text>

  <!-- Right: Real-time Telemetry Graphs & Metrics -->
  <!-- Vibration Oscilloscope Waveform -->
  <rect x="300" y="54" width="276" height="130" rx="8" fill="#151d2f" stroke="#1f2937" stroke-width="1.5"/>
  <text x="316" y="76" fill="#9ca3af" font-family="'Space Mono', monospace" font-size="10">VIBRATION SPECTRUM (3-AXIS ACCEL)</text>
  <text x="525" y="76" fill="#38bdf8" font-family="'Space Mono', monospace" font-size="10">0.42 mm/s</text>
  <!-- Grid lines -->
  <line x1="316" y1="120" x2="560" y2="120" stroke="#1e293b" stroke-width="1"/>
  <!-- Sine waveform -->
  <path d="M 316 120 Q 330 85, 345 120 T 375 120 T 405 90 T 435 150 T 465 120 T 495 105 T 525 135 T 560 120" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Temperature & RPM Cards -->
  <rect x="300" y="196" width="132" height="138" rx="8" fill="#151d2f" stroke="#1f2937" stroke-width="1.5"/>
  <text x="314" y="218" fill="#9ca3af" font-family="'Space Mono', monospace" font-size="9">TEMPERATURE</text>
  <text x="314" y="246" fill="#f87171" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="22">48.2°C</text>
  <text x="314" y="266" fill="#10b981" font-family="'Space Mono', monospace" font-size="9">Threshold: 75°C</text>
  <rect x="314" y="280" width="100" height="6" rx="3" fill="#374151"/>
  <rect x="314" y="280" width="64" height="6" rx="3" fill="#f87171"/>

  <rect x="444" y="196" width="132" height="138" rx="8" fill="#151d2f" stroke="#1f2937" stroke-width="1.5"/>
  <text x="458" y="218" fill="#9ca3af" font-family="'Space Mono', monospace" font-size="9">ROTOR SPEED</text>
  <text x="458" y="246" fill="#34d399" font-family="'Space Grotesk', sans-serif" font-weight="800" font-size="22">1440</text>
  <text x="518" y="246" fill="#9ca3af" font-family="'Space Mono', monospace" font-size="10">RPM</text>
  <text x="458" y="266" fill="#34d399" font-family="'Space Mono', monospace" font-size="9">Phase Sync: 99.8%</text>
  <rect x="458" y="280" width="100" height="6" rx="3" fill="#374151"/>
  <rect x="458" y="280" width="96" height="6" rx="3" fill="#34d399"/>
</svg>
